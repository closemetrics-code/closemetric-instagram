<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #FDF7F2;
    --surface: #FFF9F5;
    --surface-2: #F5EBE3;
    --carbon: #1E1A2E;
    --graphite: #6B6070;
    --warm-grey: #A89BA5;
    --accent: #E8445A;
    --accent-light: #FF8C42;
    --accent-dark: #C0175D;
    --border: rgba(30,26,46,0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1350px;
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--carbon);
    overflow: hidden;
  }
  .slide {
    width: 1080px;
    height: 1350px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 90px 80px;
    position: relative;
  }
  .accent-bar {
    width: 64px;
    height: 8px;
    border-radius: 4px;
    margin-bottom: 40px;
    background: linear-gradient(90deg, var(--accent), var(--accent-light));
  }
  .kicker {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(90deg, var(--accent-dark), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 24px;
  }
  .headline {
    font-size: 64px;
    font-weight: 800;
    line-height: 1.15;
    color: var(--carbon);
  }
  .body-text {
    font-size: 32px;
    font-weight: 400;
    line-height: 1.5;
    color: var(--graphite);
    margin-top: 32px;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--border);
    padding-top: 32px;
  }
  .brand-name {
    font-size: 28px;
    font-weight: 700;
    color: var(--carbon);
  }
  .page-number {
    font-size: 24px;
    color: var(--warm-grey);
  }
  .corner-glow {
    position: absolute;
    top: -120px;
    right: -120px;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(232,68,90,0.14), rgba(255,140,66,0.0) 70%);
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="corner-glow"></div>
    <div>
      <div class="accent-bar"></div>
      <div class="kicker">{{KICKER}}</div>
      <div class="headline">{{HEADLINE}}</div>
      <div class="body-text">{{BODY}}</div>
    </div>
    <div class="footer">
      <div class="brand-name">CloseMetric</div>
      <div class="page-number">{{PAGE}} / {{TOTAL}}</div>
    </div>
  </div>
</body>
</html>
