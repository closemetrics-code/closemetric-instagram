name: Weekly CloseMetric Carousel

# Runs every Monday 09:00 UTC. Adjust the cron to your timezone/schedule.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed to commit rendered images back to the repo

jobs:
  generate-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          pip install google-genai playwright

      - name: Install Chromium for Playwright
        run: playwright install --with-deps chromium

      - name: Generate this week's copy (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_weekly_content.py content/slides-${{ github.run_id }}.json

      - name: Render carousel PNGs
        run: |
          mkdir -p docs/posts
          python render_carousel.py content/slides-${{ github.run_id }}.json docs/posts/week-${{ github.run_id }}

      - name: Commit and push rendered images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/posts/ content/
          git diff --staged --quiet || git commit -m "Weekly carousel: week-${{ github.run_id }}"
          git push

      - name: Print public image URLs
        run: |
          echo "Images are now public at:"
          for f in docs/posts/week-${{ github.run_id }}_*.png; do
            echo "https://${{ github.repository_owner }}.github.io/$(basename "${{ github.repository }}")/posts/$(basename "$f")"
          done
